name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      TEST_DB_USER: ci_user
      TEST_DB_PASSWORD: ci_password_not_real
      TEST_DB_NAME: ci_test
      JWT_SECRET_KEY: ci-test-secret-key-not-a-real-secret
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        env:
          DATABASE_URL: "postgresql+asyncpg://${{ env.TEST_DB_USER }}:${{ env.TEST_DB_PASSWORD }}@localhost:5432/${{ env.TEST_DB_NAME }}"
        run: uv run pytest --cov=app --cov-report=term-missing
