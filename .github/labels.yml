# Labels-as-code. Synced automatically by .github/workflows/labels.yml
# on every push to main that touches this file (crazy-max/ghaction-github-labeler).

# Task Types
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type: feature"
  color: "0e8a16"
  description: "New functionality"
- name: "type: chore"
  color: "cfd3d7"
  description: "Tooling, infra, dependencies — no user-facing behavior change"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: refactor"
  color: "c5def5"
  description: "Code change with no functional change"

# Priority
- name: "priority: low"
  color: "c2e0c6"
  description: "Low priority"
- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority"
- name: "priority: high"
  color: "ff9f1c"
  description: "High priority"
- name: "priority: urgent"
  color: "b60205"
  description: "Urgent — blocks other work or a release"

# Area
- name: "area: auth"
  color: "5319e7"
  description: "Authentication, JWT, users"
- name: "area: orgs-projects"
  color: "5319e7"
  description: "Organizations, projects, membership, RBAC"
- name: "area: tasks"
  color: "5319e7"
  description: "Tasks, epics, subtasks, hierarchy"
- name: "area: workflow"
  color: "5319e7"
  description: "Statuses, transitions, DoR, WIP limits"
- name: "area: bug-reports"
  color: "5319e7"
  description: "BugReport → Bug conversion, triage"
- name: "area: releases"
  color: "5319e7"
  description: "Release entity, release lifecycle"
- name: "area: webhooks"
  color: "5319e7"
  description: "Webhooks, ARQ workers"
- name: "area: analytics"
  color: "5319e7"
  description: "Metrics, reports, aggregation queries"
- name: "area: infra"
  color: "5319e7"
  description: "Docker, CI/CD, deployment, dependencies"

# Meta
- name: "needs-triage"
  color: "e4e669"
  description: "Not yet reviewed/prioritized"
- name: "blocked"
  color: "000000"
  description: "Blocked by another issue or external factor"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported"
- name: "wontfix"
  color: "ffffff"
  description: "Won't be addressed"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
